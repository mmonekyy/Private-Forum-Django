{% for Post in Posts%}
<section>
  {{ Post.Title }} <br />
  {{ Post.Text|truncatechars:7 }} <br />
  {{Post.Price}} <br />
  {{Post.Add_date|date:"d/m/Y" }}<br />
  <a href="{% url 'posts_sell:one_product' Post.id %}">
  <button type="button">View Details</button>
  </a>
  <br /><br />
</section>
{% empty %}
<h3>No Products Available</h3>
{% endfor %}
