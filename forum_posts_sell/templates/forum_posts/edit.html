<form method="post">
  {% csrf_token %}
  <!-- Tytuł -->
  <label for="id_title">Enter Title:</label><br />
  <input
    type="text"
    id="id_title"
    name="title"
    maxlength="100"
    required
    value="{{ information_table.0 }}"
  /><br /><br />

  <!-- Tag -->
  <label for="id_tags">Tag:</label><br />
  <input
    type="text"
    id="id_tags"
    name="tags"
    maxlength="50"
    required
    value="{{ information_table.3|join:', ' }}"
  /><br /><br />

  <!-- Tekst -->
  <label for="id_text">Text:</label><br />
  <textarea
    id="id_text"
    name="text"
    maxlength="5000"
    rows="6"
    cols="50"
    required
  >
{{ information_table.1 }}</textarea
  ><br /><br />

  <!-- Cena -->
  <label for="id_price">Price:</label><br />
  <input
    type="number"
    id="id_price"
    name="price"
    step="0.01"
    max="99999999.99"
    required
    value="{{ information_table.2 }}"
  /><br /><br />

  <!-- Przycisk -->
  <button type="submit">Submit</button>
</form>
