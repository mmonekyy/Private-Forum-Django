{% load static %}
{% include "navbar.html" %}
<link rel="stylesheet" href="{% static 'css/setup.css' %}">
<link rel="stylesheet" href="{% static 'css/edit_sell.css' %}">
<form method="post">
  {% csrf_token %}
  <label for="id_title">Enter Title:</label><br />
  <input
    type="text"
    id="id_title"
    name="title"
    maxlength="100"
    required
    value="{{ information_table.0 }}"
  /><br /><br />

  <label for="id_tags">Tag:</label><br />
  <input
    type="text"
    id="id_tags"
    name="tags"
    maxlength="50"
    required
    value="{{ information_table.3|join:', ' }}"
  /><br /><br />

  <label for="id_text">Text:</label><br />
  <textarea
    id="id_text"
    name="text"
    maxlength="5000"
    rows="6"
    cols="50"
    required
  >
{{ information_table.1 }}</textarea
  ><br /><br />

  <label for="id_price">Price:</label><br />
  <input
    type="number"
    id="id_price"
    name="price"
    step="0.01"
    max="99999999.99"
    required
    value="{{ information_table.2 }}"
  /><br /><br />

  <label for="id_item">Item:</label><br />
  <textarea
    id="id_item"
    name="item"
    maxlength="5000"
    rows="6"
    cols="50"
    required
  >
  {{ information_table.4 }}</textarea><br /><br />
  <button type="submit">Submit</button>
</form>
