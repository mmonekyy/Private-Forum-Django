{%for user_post in user_posts%}
<section>
{{user_post.Title}}
</br>
{{user_post.Text}}
<form method="post" action="{% url 'posts_sell:delete_post' user_post.id %}">
    {% csrf_token %}
    <input type="submit" value="Delete">
</form>
<form method="post" action="{% url 'posts_sell:edit_post' user_post.id %}">
    {% csrf_token %}
    <input type="submit" value="Edit">
</form>
</section>
</br></br>  
{% endfor %}
