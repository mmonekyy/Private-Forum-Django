{% load static %}
{% include "navbar.html" %}
<link rel="stylesheet" href="{% static 'css/setup.css' %}">
<link rel="stylesheet" href="{% static 'css/my_items.css' %}">

<main class="my-items">
  {% for item in items %}
  <section class="item-card">
    <h2>{{ item.foring_key_buy_item.foring_key_sell_post.Title }}</h2>
    <p>
      Your reward:
      <a href="{% url 'posts_sell:item_detail' item.id %}">
        {{ item.foring_key_buy_item.Text|truncatechars:50 }}
      </a>
    </p>
  </section>
  {% empty %}
  <p class="no-items">You don’t have any items yet.</p>
  {% endfor %}
</main>
