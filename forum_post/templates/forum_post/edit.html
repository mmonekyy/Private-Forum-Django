{% include 'navbar.html' %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/setup.css' %}">
<link rel="stylesheet" href="{% static 'css/edit.css' %}">
<body>
    <div class="edit-form-container">
        <input type="button" value="Go Back" onclick="history.back()">
        <form method="post">
            {% csrf_token %}
            
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" maxlength="200" required value="{{ form_data.Title }}"><br><br>

            <label for="content">Content:</label><br>
            <textarea id="content" name="content" rows="10" required>{{ form_data.Content }}</textarea><br><br>

            <label for="tags">Tags (comma-separated):</label><br>
            <input type="text" id="tags" name="tags" maxlength="100" value="{{ tags }}"><br><br>

            <input type="submit" value="Save Changes">
        </form>
    </div>
</body>
